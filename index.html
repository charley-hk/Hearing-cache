<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearing — Transmission</title>
  <style>
    body {
      background: #111;
      color: #ddd;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    .radio {
      max-width: 500px;
      margin: auto;
      border: 2px solid #555;
      border-radius: 12px;
      padding: 30px 20px;
      background: #222;
    }

    h1 {
      letter-spacing: 4px;
    }

    .status {
      margin: 25px 0;
      color: #8f8;
      letter-spacing: 2px;
    }

    audio {
      width: 100%;
    }

    p {
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="radio">

    <h1>HEARING</h1>

    <div class="status">
      ● TRANSMISSION RECEIVED
    </div>

    <p>
      Listen carefully.<br>
      You may need to listen more than once.
    </p>

    <audio controls>
      <source src="transmission 3.mp3" type="audio/mpeg">
      Your device cannot play this audio.
    </audio>

  </div>
</body>
</html>
